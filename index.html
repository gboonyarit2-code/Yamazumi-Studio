<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />

<title>Standard Work & Yamazumi Studio</title>
<style>
:root{
  --bg:#f4f7fb;--panel:#ffffff;--text:#172033;--muted:#667085;--line:#d9e0ea;
  --accent:#315efb;--danger:#d92d20;--ok:#039855;--warn:#dc6803;--header:#0f172a;
  --shadow:0 10px 30px rgba(15,23,42,.08);--radius:14px;
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit} button{cursor:pointer}
.topbar{height:64px;background:var(--header);color:#fff;display:flex;align-items:center;gap:14px;padding:0 18px;position:sticky;top:0;z-index:20}
.brand{font-weight:800;letter-spacing:.2px;white-space:nowrap}.brand small{font-weight:500;opacity:.65;margin-left:8px}
.spacer{flex:1}.btn{border:1px solid transparent;border-radius:9px;padding:8px 12px;background:#fff;color:#172033}.btn:hover{filter:brightness(.98)}
.btn.primary{background:var(--accent);color:#fff}.btn.ghost{background:transparent;border-color:#475569;color:#fff}.btn.soft{background:#eef2ff;color:#253ea7}.btn.danger{background:#fee4e2;color:#b42318}.btn.small{padding:5px 9px;font-size:12px}
select,input,textarea{border:1px solid #cfd7e3;border-radius:8px;background:#fff;padding:7px 8px;color:#172033} input[type=number]{width:86px}.topbar select{background:#111c34;color:#fff;border-color:#334155}
.nav{display:flex;gap:4px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:64px;z-index:15}.nav button{border:0;background:transparent;padding:9px 13px;border-radius:9px;color:#475467;font-weight:650}.nav button.active{background:#eef2ff;color:#253ea7}
.page{display:none;padding:16px}.page.active{display:block}.grid{display:grid;grid-template-columns:minmax(680px,1.2fr) minmax(520px,1fr);gap:14px}.panel{background:var(--panel);border:1px solid #e4e8ef;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}.panel-h{padding:12px 14px;border-bottom:1px solid #e9edf3;display:flex;align-items:center;gap:10px}.panel-h h3{margin:0;font-size:15px}.panel-b{padding:12px 14px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:10px;margin-bottom:14px}.kpi{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:11px 12px}.kpi .label{font-size:12px;color:var(--muted)}.kpi .value{font-size:22px;font-weight:800;margin-top:3px}.kpi .sub{font-size:11px;color:#98a2b3;margin-top:2px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar .group{display:flex;align-items:center;gap:6px;padding-right:8px;border-right:1px solid #e5e7eb}.toolbar label{font-size:12px;color:#667085}.status-dot{width:9px;height:9px;border-radius:99px;background:var(--ok);display:inline-block}
.table-wrap{overflow:auto;max-height:520px;border-top:1px solid #eef2f6} table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:12px} th,td{border-right:1px solid #edf1f5;border-bottom:1px solid #edf1f5;padding:6px;vertical-align:middle;background:#fff} th{position:sticky;top:0;z-index:3;background:#f8fafc;color:#475467;font-weight:750;white-space:nowrap} td input,td select{padding:5px 6px;border-radius:6px;font-size:12px;min-width:70px} td input[type=text]{min-width:120px}.row-actions{display:flex;gap:4px}
.chart-tabs{display:flex;gap:4px}.chart-tabs button{border:0;background:#f2f4f7;padding:6px 9px;border-radius:7px;font-size:12px}.chart-tabs button.active{background:#dfe7ff;color:#2445b8}.chart-area{height:560px;overflow:auto;background:linear-gradient(#fff,#fbfcfe);position:relative}.chart-area svg{display:block;transform-origin:top left}.chart-area.fit-mode{overflow:hidden}.chart-area.fit-mode svg{max-width:none}.zoom-controls{display:flex;gap:4px}.zoom-controls .btn{min-width:30px;padding:5px 8px}.load-summary{margin-top:8px}.load-summary .panel-h{min-height:30px;padding:5px 0;border-bottom:0}.load-summary .panel-h h3{font-size:12px}.load-summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px}.load-card{border:1px solid #e5eaf1;border-radius:8px;padding:7px;background:#fff}.load-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:5px;font-size:10.5px}.load-head>span{font-size:9.5px;color:#667085}.stackbar{display:flex;height:14px;border-radius:5px;overflow:hidden;background:#eef2f6;border:1px solid #dde3ea}.stackbar span{height:100%;display:block;min-width:0}.load-legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 8px;margin-top:5px;font-size:9.5px;color:#475467}.load-legend div{display:flex;justify-content:space-between;gap:6px}.chart-area.fit-mode svg{max-width:none}.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:#475467}.leg{display:flex;align-items:center;gap:5px}.swatch{width:14px;height:8px;border-radius:3px;background:#888}.line-swatch{width:18px;border-top:2px dashed #111}
.sidecard{background:#f8fafc;border:1px solid #e5eaf1;border-radius:8px;padding:7px 9px;margin-top:7px}.sidecard.collapsed{padding:5px 9px}.sidecard .calc-head{display:flex;align-items:center;gap:8px}.sidecard .calc-head h4{margin:0;font-size:11px}.sidecard .collapse-btn{margin-left:auto;border:0;background:transparent;color:#667085;font-size:15px;line-height:1;cursor:pointer;padding:2px 5px}.sidecard .calc-body{margin-top:5px}.sidecard.collapsed .calc-body{display:none}.calcline{display:flex;justify-content:space-between;gap:12px;padding:2px 0;border-bottom:1px dashed #e2e8f0;font-size:10px}.calcline:last-child{border-bottom:0}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.scenario-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.scenario-card{border:1px solid #dfe4eb;border-radius:12px;padding:12px;background:#fff}.scenario-card.active{outline:2px solid #91a7ff}.scenario-card h4{margin:0 0 6px}.scenario-card .meta{font-size:12px;color:#667085;margin-bottom:10px}.scenario-actions{display:flex;gap:6px;flex-wrap:wrap}
.compare-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.compare-card{border:1px solid #e3e8ef;border-radius:12px;background:#fff;padding:12px}.compare-card h4{margin:0 0 8px}.metric{display:flex;justify-content:space-between;border-bottom:1px solid #eef2f6;padding:5px 0;font-size:12px}.metric:last-child{border-bottom:0}.barline{height:9px;background:#eef2f6;border-radius:99px;overflow:hidden;margin:5px 0}.barline span{display:block;height:100%;background:#6680ff;border-radius:99px}
.guide{display:grid;grid-template-columns:250px 1fr;gap:14px}.guide-nav{background:#fff;border:1px solid #e5e9f0;border-radius:12px;padding:8px;height:max-content;position:sticky;top:128px}.guide-nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px;border-radius:7px}.guide-nav button:hover{background:#f3f5f8}.guide-content{background:#fff;border:1px solid #e5e9f0;border-radius:12px;padding:18px;line-height:1.6}.guide-content h2{margin-top:0}.guide-content code{background:#f2f4f7;padding:2px 5px;border-radius:5px}.guide-content .formula{background:#f8fafc;border-left:4px solid #6680ff;padding:10px 12px;border-radius:8px;margin:10px 0}.guide-content table{width:100%;min-width:0}.guide-content th{position:static}
#chartPanel:fullscreen{background:#fff;border:0;border-radius:0;display:flex;flex-direction:column;width:100vw;height:100vh}#chartPanel:fullscreen .panel-h{flex:0 0 auto}#chartPanel:fullscreen .panel-b{display:flex;flex-direction:column;min-height:0;flex:1}#chartPanel:fullscreen .chart-area{height:auto;min-height:0;flex:1}#chartPanel:fullscreen .sidecard{max-height:24vh;overflow:auto}.developer-footer{padding:12px 18px 18px;text-align:center;color:#667085;font-size:12px}.developer-footer strong{color:#344054}.copyright-note{margin-top:24px;padding-top:14px;border-top:1px solid #e5e9f0;color:#667085;font-size:12px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:60}.modal.show{display:flex}.modal-card{width:min(560px,92vw);background:#fff;border-radius:14px;box-shadow:0 30px 70px rgba(0,0,0,.25);padding:18px}.modal-card h3{margin:0 0 12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-grid label{font-size:12px;color:#667085}.form-grid label span{display:block;margin-bottom:4px}.form-grid input,.form-grid select{width:100%}
.toast{position:fixed;right:18px;bottom:18px;background:#101828;color:#fff;border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);display:none;z-index:100;font-size:13px}.toast.show{display:block}
@media(max-width:1200px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.topbar{height:auto;flex-wrap:wrap;padding:10px}.nav{top:96px;overflow:auto}.page{padding:10px}.kpis{grid-template-columns:repeat(2,1fr)}.guide{grid-template-columns:1fr}.guide-nav{position:static}.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">Standard Work & Yamazumi Studio <small>V1.4</small></div>
  <span class="status-dot" title="Local app"></span>
  <select id="scenarioSelect" title="Scenario"></select>
  <div class="spacer"></div>
  <button class="btn ghost" id="newProjectBtn">New Project</button>
  <button class="btn ghost" id="saveBtn">Save Project</button>
  <button class="btn ghost" id="loadBtn">Load Project</button>
  <input id="loadInput" type="file" accept=".yamproj,.json" hidden />
  <select id="languageSelect"><option value="en">EN</option><option value="th">TH</option></select>
</div>
<div class="nav" id="nav"></div>

<section class="page active" id="workPage">
  <div class="kpis" id="kpis"></div>
  <div class="grid">
    <div class="panel">
      <div class="panel-h">
        <h3 data-i18n="workData">Work Data</h3>
        <div class="spacer"></div>
        <div class="toolbar">
          <div class="group"><label data-i18n="unit">Unit</label><select id="timeUnit"><option value="sec">sec</option><option value="min">min</option></select></div>
          <div class="group"><label data-i18n="taktMode">Takt Mode</label><select id="taktMode"><option value="manual">Manual</option><option value="auto">Auto</option></select></div>
          <button class="btn soft small" id="scenarioSettingsBtn" data-i18n="scenarioSettings">Scenario Settings</button>
          <button class="btn soft small" id="importExcelBtn" data-i18n="importExcel">Import Excel</button><input id="excelInput" type="file" accept=".xlsx,.xls" hidden />
          <button class="btn primary small" id="addRowBtn" data-i18n="addProcess">+ Process</button>
        </div>
      </div>
      <div class="table-wrap"><table id="processTable"></table></div>
    </div>
    <div class="panel" id="chartPanel">
      <div class="panel-h">
        <h3 data-i18n="charts">Charts</h3>
        <div class="chart-tabs" id="chartTabs">
          <button data-mode="standard" class="active" data-i18n="standardView">Standard Work Combination</button>
          <button data-mode="classic" data-i18n="classicView">Classic Connected Lines</button>
          <button data-mode="yamazumi" data-i18n="yamazumiView">Yamazumi</button>
        </div>
        <div class="spacer"></div>
        <div class="zoom-controls"><button class="btn soft small" id="zoomOutBtn" title="Zoom Out">−</button><button class="btn soft small" id="zoomResetBtn" title="Reset Zoom">100%</button><button class="btn soft small" id="zoomInBtn" title="Zoom In">+</button></div><button class="btn soft small" id="fitChartBtn" data-i18n="fit">Fit</button>
        <button class="btn soft small" id="fullscreenChartBtn" data-i18n="fullscreen">Full Screen</button>
      </div>
      <div class="panel-b">
        <div class="legend" id="legend"></div>
        <div class="chart-area" id="chartArea"></div>
        <div class="sidecard" id="calcCard"></div><div class="load-summary" id="operatorLoadSummary"></div>
      </div>
    </div>
  </div>
</section>

<section class="page" id="scenariosPage">
  <div class="panel">
    <div class="panel-h"><h3 data-i18n="scenarios">Scenarios</h3><div class="spacer"></div><button class="btn soft" id="blankScenarioBtn" data-i18n="blankScenario">Blank Scenario</button><button class="btn primary" id="duplicateScenarioBtn" data-i18n="duplicateScenario">Duplicate Current</button></div>
    <div class="panel-b"><div class="scenario-list" id="scenarioList"></div></div>
  </div>
</section>

<section class="page" id="comparePage">
  <div class="panel">
    <div class="panel-h"><h3 data-i18n="compare">Compare Scenarios</h3><div class="spacer"></div><span style="font-size:12px;color:#667085" data-i18n="compareHint">Select scenarios to compare.</span></div>
    <div class="panel-b"><div class="toolbar" id="compareChecks" style="margin-bottom:12px"></div><div class="compare-grid" id="compareGrid"></div></div>
  </div>
</section>

<section class="page" id="guidePage">
  <div class="guide"><div class="guide-nav" id="guideNav"></div><div class="guide-content" id="guideContent"></div></div>
</section>

<div class="modal" id="settingsModal"><div class="modal-card">
  <h3 data-i18n="scenarioSettings">Scenario Settings</h3>
  <div class="form-grid">
    <label><span data-i18n="scenarioName">Scenario Name</span><input id="setName" /></label>
    <label><span data-i18n="timeUnit">Time Unit</span><select id="setUnit"><option value="sec">sec</option><option value="min">min</option></select></label>
    <label><span data-i18n="taktMode">Takt Mode</span><select id="setTaktMode"><option value="manual">Manual</option><option value="auto">Auto</option></select></label>
    <label><span data-i18n="manualTakt">Manual Takt</span><input id="setManualTakt" type="number" min="0" step="0.01" /></label>
    <label><span data-i18n="availableTime">Available Production Time</span><input id="setAvailable" type="number" min="0" step="0.01" /></label>
    <label><span data-i18n="requiredQty">Required Quantity</span><input id="setDemand" type="number" min="0" step="1" /></label>
    <label><span data-i18n="commonQtyMode">Common Qty Mode</span><select id="setCommonQtyMode"><option value="auto" data-i18n="autoLCM">Auto (LCM Set Qty)</option><option value="manual" data-i18n="manualOverride">Manual Override</option></select></label>
    <label><span data-i18n="batchQty">Batch / Common Qty</span><input id="setCommonQty" type="number" min="1" step="1" /></label>
  </div>
  <div class="modal-actions"><button class="btn" id="cancelSettings" data-i18n="cancel">Cancel</button><button class="btn primary" id="applySettings" data-i18n="apply">Apply</button></div>
</div></div>
<div class="toast" id="toast"></div>
<div class="developer-footer">🛠️© 2026 <strong>Boonyarit Chotisatkul</strong></div>

<script>

function t(k){return (I18N[state.project.language]||I18N.en)[k]||k}
function activeScenario(){return state.project.scenarios.find(s=>s.id===state.project.activeScenarioId)||state.project.scenarios[0]}
function toSec(v,unit){v=Number(v)||0;return unit==='min'?v*60:v}
function fromSec(v,unit){return unit==='min'?v/60:v}
function fmtSec(v,unit=activeScenario().timeUnit){const n=fromSec(v,unit);return `${Number(n.toFixed(2))} ${unit}`}
function effectiveTime(p,key,scenario){let v=Number(p[key])||0;if(p.basis==='perPiece')v*=Math.max(1,Number(p.setQty)||1);return toSec(v,scenario.timeUnit)}
function calcTaktSec(s){if(s.taktMode==='auto'){const avail=toSec(s.availableTime,s.timeUnit);return (Number(s.requiredQty)||0)>0?avail/Number(s.requiredQty):0}return toSec(s.manualTakt,s.timeUnit)}
function gcd(a,b){a=Math.abs(Math.round(a));b=Math.abs(Math.round(b));while(b){const t=b;b=a%b;a=t}return a||1}
function lcm(a,b){a=Math.max(1,Math.round(a));b=Math.max(1,Math.round(b));return Math.abs(a*b)/gcd(a,b)}
function commonProductionQty(s){if(s.commonQtyMode==='manual' && Number(s.commonQtyOverride)>0)return Math.min(1000,Math.max(1,Math.round(Number(s.commonQtyOverride))));const qs=s.processes.map(p=>Math.max(1,Math.round(Number(p.setQty)||1)));return Math.min(1000,qs.reduce((a,b)=>lcm(a,b),1))}
function calculateScenario(s){
 const commonQty=commonProductionQty(s); const machineReady={}; const opTime={}; const opSegments={}; const operatorLoads={}; const processResults={}; const machineSegments={}; let totalAuto=0,totalWalk=0,totalWait=0,totalManual=0;
 const rows=[...s.processes].sort((a,b)=>(Number(a.operator)-Number(b.operator))||(Number(a.workSeq)-Number(b.workSeq))||(Number(a.usageSeq)-Number(b.usageSeq)));
 const operators=[...new Set(rows.map(p=>String(p.operator||1)))];
 const occurrenceCounter={};
 operators.forEach(op=>{opTime[op]=0;opSegments[op]=[];operatorLoads[op]={manual:0,load:0,unload:0,inspection:0,other:0,walking:0,waiting:0};machineSegments[op]={}});
 // Simulate one common production batch. A process with Set Qty=N executes once every N produced pieces.
 for(let pieceCycle=1; pieceCycle<=commonQty; pieceCycle++){
   for(const p of rows){
     const setQty=Math.max(1,Math.round(Number(p.setQty)||1));
     if((pieceCycle-1)%setQty!==0)continue;
     const op=String(p.operator||1); const occ=(occurrenceCounter[p.id]||0)+1; occurrenceCounter[p.id]=occ;
     let start=opTime[op]; const manual=effectiveTime(p,'manual',s); const baseAuto=effectiveTime(p,'auto',s); const auto2=effectiveTime(p,'auto2',s);
     const freq=Math.max(0,Number(p.frequency)||0); const trigger=freq>0 && occ%freq===0 && auto2>0; const autoActual=trigger?(p.auto2Mode==='add'?baseAuto+auto2:auto2):baseAuto;
     const machine=p.machine||`__${p.id}`; const ready=autoActual>0?(machineReady[machine]||0):0; let wait=0;
     if(autoActual>0 && p.handling==='wait' && start<ready){let allowed=0;if(p.ol){allowed=toSec(Number(p.overlap)||0,s.timeUnit);if(!allowed)allowed=Math.max(0,ready-start)}wait=Math.max(0,ready-start-allowed);start+=wait;opTime[op]+=wait;if(wait){opSegments[op].push({type:'waiting',start:start-wait,end:start,pid:p.id,label:p.process,pieceCycle,occurrence:occ});operatorLoads[op].waiting+=wait}}
     const mStart=start,mEnd=start+manual; const cat=MANUAL_CATEGORIES.includes(p.category)?p.category:'manual';
     if(manual){opSegments[op].push({type:cat,start:mStart,end:mEnd,pid:p.id,label:p.process,pieceCycle,occurrence:occ});operatorLoads[op][cat]+=manual} opTime[op]=mEnd; totalManual+=manual;
     const autoStart=mEnd,autoEnd=mEnd+autoActual; if(autoActual>0)machineReady[machine]=autoEnd; totalAuto+=autoActual;
     if(autoActual){if(!machineSegments[op][machine])machineSegments[op][machine]=[];machineSegments[op][machine].push({start:autoStart,end:autoEnd,pid:p.id,label:p.process,trigger,pieceCycle,occurrence:occ})}
     const usage=Math.min(5,Math.max(1,Number(p.usageSeq)||1)); const walkRaw=(p.walk||[])[usage-1] ?? (p.walk||[])[0] ?? 0; const walk=toSec(Number(walkRaw)||0,s.timeUnit); const wStart=opTime[op],wEnd=wStart+walk;
     if(walk){opSegments[op].push({type:'walking',start:wStart,end:wEnd,pid:p.id,label:p.walkComment?.[usage-1]||p.process,pieceCycle,occurrence:occ});operatorLoads[op].walking+=walk} opTime[op]=wEnd; totalWalk+=walk; totalWait+=wait;
     if(!processResults[p.id])processResults[p.id]={manual:0,baseAuto:0,auto2:0,autoActual:0,wait:0,walk:0,executions:0,triggers:0,occurrences:[]};
     const pr=processResults[p.id];pr.manual+=manual;pr.baseAuto+=baseAuto;pr.auto2+=auto2;pr.autoActual+=autoActual;pr.wait+=wait;pr.walk+=walk;pr.executions++;if(trigger)pr.triggers++;pr.occurrences.push({pieceCycle,occurrence:occ,start:mStart,end:wEnd,autoStart,autoEnd,trigger});
   }
 }
 const operatorBatchCT={},operatorCT={},operatorElapsedBatch={};
 Object.keys(opTime).forEach(k=>{const L=operatorLoads[k]||{};const work=MANUAL_CATEGORIES.reduce((a,cat)=>a+(L[cat]||0),0)+(L.walking||0);operatorBatchCT[k]=work;operatorCT[k]=work/commonQty;operatorElapsedBatch[k]=opTime[k]});
 const batchLineCT=Math.max(0,...Object.values(operatorElapsedBatch));
 // Match the original workbook: operator C/T is work content; hand waiting is shown separately up to Line C/T.
 Object.keys(operatorLoads).forEach(op=>{const existingProcessWait=operatorLoads[op].waiting||0;const totalHandWait=Math.max(existingProcessWait,batchLineCT-operatorBatchCT[op]);const endIdle=Math.max(0,batchLineCT-opTime[op]);if(endIdle){opSegments[op].push({type:'waiting',start:opTime[op],end:batchLineCT,pid:'',label:'Line balance waiting',pieceCycle:commonQty,occurrence:0})}operatorLoads[op].waiting=totalHandWait;});
 totalWait=Object.values(operatorLoads).reduce((a,L)=>a+(L.waiting||0),0);
 const actualLineCT=batchLineCT/commonQty; const takt=calcTaktSec(s); const batchTakt=takt*commonQty; const bottleneck=Object.entries(operatorElapsedBatch).sort((a,b)=>b[1]-a[1])[0]?.[0]||'-';
 return {commonQty,operatorCT,operatorBatchCT,operatorElapsedBatch,opSegments,operatorLoads,actualLineCT,batchLineCT,takt,batchTakt,bottleneck,totalAuto,totalWalk,totalWait,totalManual,processResults,machineReady,machineSegments};
}

function renderStandardChart(){
  const s=activeScenario();
  const c=calculateScenario(s);
  const area=document.getElementById('chartArea');
  const max=Math.max(c.batchLineCT,c.batchTakt,60);
  const px=Math.max(5,900/max);
  const width=Math.max(900,max*px+180);
  const ops=Object.keys(c.operatorCT).sort((a,b)=>Number(a)-Number(b));
  const opHeaderH=50, machineRowH=32, groupGap=14, topY=48;
  const groupedMachines={};
  ops.forEach(op=>{groupedMachines[op]=[...new Set(Object.keys(c.machineSegments[op]||{}))].sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true,sensitivity:'base'}));});
  let cursorY=topY;const layout={};
  ops.forEach(op=>{layout[op]={operatorY:cursorY,machineYs:{}};cursorY+=opHeaderH;groupedMachines[op].forEach(machine=>{layout[op].machineYs[machine]=cursorY;cursorY+=machineRowH});cursorY+=groupGap;});
  const height=Math.max(160,cursorY+24);let svg=`<svg width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg">`;
  // 1) Group backgrounds first.
  ops.forEach((op,idx)=>{const y=layout[op].operatorY,machines=groupedMachines[op],groupBottom=(machines.length?layout[op].machineYs[machines[machines.length-1]]+machineRowH:y+opHeaderH-6),groupH=groupBottom-y;if(idx%2===0)svg+=`<rect x="0" y="${y-5}" width="${width}" height="${groupH+5}" fill="#fbfcfe"/>`;});
  // 2) Full-height grid on top of backgrounds so Operator 1 never hides it.
  const step=Math.max(5,Math.round(max/12/5)*5);
  for(let tsec=0;tsec<=max;tsec+=step){const x=120+tsec*px;svg+=`<line x1="${x}" y1="30" x2="${x}" y2="${height-20}" stroke="#e8edf3" vector-effect="non-scaling-stroke"/><text x="${x+2}" y="18" font-size="10" fill="#667085">${Number(fromSec(tsec,s.timeUnit).toFixed(1))}</text>`;}
  // 3) Operator and machine content.
  ops.forEach((op)=>{const y=layout[op].operatorY,machines=groupedMachines[op],groupBottom=(machines.length?layout[op].machineYs[machines[machines.length-1]]+machineRowH:y+opHeaderH-6);svg+=`<text x="12" y="${y+17}" font-size="12" font-weight="700" fill="#334155">Operator ${op}</text><line x1="120" y1="${y+27}" x2="${width-20}" y2="${y+27}" stroke="#d9e1ea"/>`;
    for(const seg of c.opSegments[op]){const x=120+seg.start*px,w=Math.max(2,(seg.end-seg.start)*px),col=COLORS[seg.type]||COLORS.other;svg+=`<rect data-pid="${seg.pid}" x="${x}" y="${y}" width="${w}" height="20" rx="4" fill="${col}" opacity=".9"><title>${esc(seg.label)} | ${seg.type} | ${fmtSec(seg.end-seg.start,s.timeUnit)}</title></rect>`;}
    machines.forEach(machine=>{const my=layout[op].machineYs[machine];svg+=`<text x="28" y="${my+14}" font-size="10.5" font-weight="700" fill="#475569">↳ ${t('machine')} ${esc(machine)}</text><line x1="120" y1="${my+19}" x2="${width-20}" y2="${my+19}" stroke="#e2e8f0"/>`;(c.machineSegments[op]?.[machine]||[]).forEach(seg=>{const x=120+seg.start*px,w=Math.max(2,(seg.end-seg.start)*px);svg+=`<rect data-pid="${seg.pid}" x="${x}" y="${my}" width="${w}" height="14" rx="3" fill="${seg.trigger?COLORS.auto2:COLORS.auto}" opacity=".86"><title>Operator ${esc(op)} | ${esc(machine)} | ${esc(seg.label)} | Auto ${fmtSec(seg.end-seg.start,s.timeUnit)} | Cycle ${seg.pieceCycle}</title></rect>`;});});

<tr><td><b>Manual Time</b></td><td>เวลาที่ Operator ลงมือทำงานจริงใน Process นั้น</td></tr>
<tr><td><b>Auto Time</b></td><td>เวลาเครื่องจักรทำงานอัตโนมัติ โดย Operator สามารถไปทำงานอื่นได้ถ้าเงื่อนไขอนุญาต</td></tr>
<tr><td><b>Auto 2</b></td><td>เวลา Auto ทางเลือกที่เกิดตาม Frequency และใช้แบบ Replace หรือ Add</td></tr>
<tr><td><b>Frequency</b></td><td>ความถี่ที่ Auto 2 เกิด เช่น 5 = ทุก 5 cycle</td></tr>
<tr><td><b>Walking 1–5</b></td><td>เวลาเดินไปยัง Usage Sequence/เส้นทางถัดไป ช่องว่างถือเป็น 0</td></tr>
<tr><td><b>Walking Comment 1–5</b></td><td>คำอธิบายว่า Walking นั้นทำอะไรหรือเดินจากไหนไปไหน</td></tr>
<tr><td><b>OL</b></td><td>เปิด/ปิดการอนุญาตให้ Manual overlap กับ Auto ตามเงื่อนไขของ Process</td></tr>
<tr><td><b>Overlap Time</b></td><td>เวลาสูงสุดที่ Manual สามารถเริ่มก่อน Auto จบได้ เมื่อ OL เปิด</td></tr>
<tr><td><b>Auto Handling</b></td><td><b>Wait</b> = รอถ้า Auto ยังไม่จบ, <b>Skip / Continue</b> = ไปทำงานอื่นก่อนแล้วกลับมา</td></tr>
<tr><td><b>Comment</b></td><td>หมายเหตุทั่วไปของ Process</td></tr>
</tbody></table>
<div class="formula"><b>ตัวอย่าง Takt Auto:</b> Available Production Time 420 min ÷ Required Quantity 500 pcs = 0.84 min/pc = 50.4 sec/pc</div>`:`<h2>Input Field Reference</h2>
<table><thead><tr><th>Field</th><th>Meaning / Usage</th></tr></thead><tbody>
<tr><td><b>Takt Calculation Mode</b></td><td><b>Manual</b> = enter takt directly. <b>Auto</b> = calculate from Available Production Time ÷ Required Quantity.</td></tr>
<tr><td><b>Manual Takt</b></td><td>User-defined takt/target such as 60 sec/pc. Used when Takt Mode is Manual.</td></tr>
<tr><td><b>Available Production Time</b></td><td>Net time available for production after breaks and planned stops. Example: 480 min − 60 min breaks = 420 min.</td></tr>
<tr><td><b>Required Quantity</b></td><td>Demand to be produced during the available production time.</td></tr>
<tr><td><b>Takt Time</b></td><td>Required production pace to meet demand. Example: 420 min ÷ 420 pcs = 1 min/pc = 60 sec/pc.</td></tr>
<tr><td><b>Operator</b></td><td>Operator number responsible for the process.</td></tr>
<tr><td><b>Work Sequence</b></td><td>Execution order for each operator, starting from 1.</td></tr>
<tr><td><b>Usage Sequence</b></td><td>Machine-use order 1–5 for parallel-machine work within the same work sequence.</td></tr>
<tr><td><b>Process Name</b></td><td>Name of the work step, e.g. Loading, Tightening, Inspection.</td></tr>
<tr><td><b>Machine No.</b></td><td>Machine name or identifier used by the process.</td></tr>
<tr><td><b>Set Qty</b></td><td>Number of pieces handled in one process execution. It is used to determine common production quantity and execution count per batch.</td></tr><tr><td><b>Common Qty Mode</b></td><td><b>Auto</b> uses the LCM of all Set Qty values; <b>Manual Override</b> is useful when studying only part of a line while preserving a batch basis such as 2 pcs.</td></tr>
<tr><td><b>Basis</b></td><td><b>Per Piece</b> multiplies time by Set Qty. <b>Per Set</b> treats the entered time as the total for the whole set.</td></tr>
<tr><td><b>Work Category</b></td><td>Manual, Load, Unload, Inspection, or Other. Used for chart colors and Operator Load Summary.</td></tr>
<tr><td><b>Manual Time</b></td><td>Hands-on operator time for the process.</td></tr>
<tr><td><b>Auto Time</b></td><td>Automatic machine-running time. The operator may move to other work when logic allows.</td></tr>
<tr><td><b>Auto 2</b></td><td>Alternate automatic time triggered by Frequency and applied as Replace or Add.</td></tr>
<tr><td><b>Frequency</b></td><td>How often Auto 2 occurs; e.g. 5 means every fifth cycle.</td></tr>
<tr><td><b>Walking 1–5</b></td><td>Walking time to the next usage sequence/route. Blank is treated as zero.</td></tr>
<tr><td><b>Walking Comment 1–5</b></td><td>Description of what happens during that walking segment or where the operator walks.</td></tr>
<tr><td><b>OL</b></td><td>Enables or disables manual/automatic overlap according to process logic.</td></tr>
<tr><td><b>Overlap Time</b></td><td>Maximum amount of time manual work may start before automatic completion when OL is enabled.</td></tr>
<tr><td><b>Auto Handling</b></td><td><b>Wait</b> means the operator waits if Auto is not finished; <b>Skip / Continue</b> means the operator may perform other work first.</td></tr>
<tr><td><b>Comment</b></td><td>General note for the process.</td></tr>
</tbody></table>

category:th?`<h2>Work Category และระบบสี</h2><p>กำหนดประเภทงานให้แต่ละ Process: Manual, Load, Unload, Inspection หรือ Other. สีของกราฟยึดตามประเภทงานเพื่อให้ทุก Operator อ่านความหมายของสีเหมือนกัน ส่วน Walking, Waiting และ Machine Auto ใช้กลุ่มสีเฉพาะของตัวเอง</p><p>Operator Load Summary จะแยกเวลาแต่ละประเภท พร้อม Stacked Bar เพื่อดูสัดส่วน Manual/Load/Unload/Inspection/Walking/Waiting/Other ของ Operator แต่ละคน</p>`:`<h2>Work Category & Color System</h2><p>Assign each process to Manual, Load, Unload, Inspection, or Other. Chart colors are based on activity type so the same color means the same thing across all operators. Walking, Waiting and Machine Auto use their own color families.</p><p>Operator Load Summary breaks down each category and shows a stacked bar for Manual/Load/Unload/Inspection/Walking/Waiting/Other per operator.</p>`,
start:th?`<h2>เริ่มต้นใช้งาน</h2><p>1 Project สามารถมีหลาย Scenario ได้ ใช้ตาราง Work Data สำหรับกรอกข้อมูล และดูกราฟ Standard Work Combination, กราฟเส้นต่อเนื่อง หรือ Yamazumi ทางด้านขวา</p><p>หน่วยเวลาเลือกได้ทั้ง <b>sec</b> และ <b>min</b> ตั้งแต่ต้น และสามารถเปลี่ยนภายหลังได้โดยระบบแปลงค่าที่เกี่ยวข้องให้อัตโนมัติ</p><p><b>Import Excel</b> ใช้นำเข้าข้อมูล Work Data จากไฟล์ Excel โดยรองรับไฟล์ .xlsx รูปแบบต้นแบบญี่ปุ่นและหัวคอลัมน์ทั่วไปบางรูปแบบ</p>`:`<h2>Getting Started</h2><p>One project can contain multiple scenarios. Enter work data in the table and analyze it using the Standard Work Combination, Classic Connected Lines, or Yamazumi view.</p><p>Time input supports both <b>sec</b> and <b>min</b>. Changing the scenario unit converts related values automatically.</p><p><b>Import Excel</b> can populate Work Data from an Excel workbook, including .xlsx files using the Japanese prototype layout and common English headers.</p>`,
logic:th?`<h2>Logic การคำนวณ</h2><div class="formula"><b>Operator C/T</b> = Manual + Walking + Waiting + กิจกรรมของ Operator</div><div class="formula"><b>Common Production Qty</b> = LCM(Set Qty)</div><div class="formula"><b>Executions per Process</b> = Common Production Qty ÷ Set Qty</div><div class="formula"><b>Actual Line C/T per piece</b> = MAX(Operator Batch C/T) ÷ Common Production Qty</div><div class="formula"><b>Takt per piece</b> = Available Production Time ÷ Required Quantity</div><div class="formula"><b>Batch Takt</b> = Takt per piece × Common Production Qty</div><p>Machine Auto Timeline แยกจาก Operator Timeline ดังนั้น Auto Time จะไม่ถูกบวกเข้า Operator C/T โดยตรง เว้นแต่ Operator ต้องรอเครื่อง</p><p><b>Per Piece:</b> เวลา Manual/Auto/Auto2 คูณ Set Qty. <b>Per Set:</b> เวลาที่กรอกคือเวลารวมของทั้ง Set.</p>`:`<h2>Calculation Logic</h2><div class="formula"><b>Operator C/T</b> = Manual + Walking + Waiting + operator activities</div><div class="formula"><b>Common Production Qty</b> = LCM(Set Qty)</div><div class="formula"><b>Executions per Process</b> = Common Production Qty ÷ Set Qty</div><div class="formula"><b>Actual Line C/T per piece</b> = MAX(Operator Batch C/T) ÷ Common Production Qty</div><div class="formula"><b>Takt per piece</b> = Available Production Time ÷ Required Quantity</div><div class="formula"><b>Batch Takt</b> = Takt per piece × Common Production Qty</div><p>Machine automatic time runs on a separate timeline and is not added directly to operator C/T unless it causes operator waiting.</p><p><b>Per Piece:</b> Manual/Auto/Auto2 are multiplied by Set Qty. <b>Per Set:</b> entered time is the total for the set.</p>`,
auto2:th?`<h2>Auto 2 + Frequency</h2><p>เลือกได้ต่อ Process:</p><div class="formula"><b>Replace</b>: เมื่อถึงรอบ Frequency ใช้ Auto 2 แทน Auto ปกติ</div><div class="formula"><b>Add</b>: เมื่อถึงรอบ Frequency ใช้ Auto + Auto 2</div>`:`<h2>Auto 2 + Frequency</h2><p>Per process, choose:</p><div class="formula"><b>Replace</b>: on the frequency cycle, Auto 2 replaces the normal Auto time.</div><div class="formula"><b>Add</b>: on the frequency cycle, Auto 2 is added to the normal Auto time.</div>`,
walking:th?`<h2>Walking 1–5</h2><p>Walking 1–5 ใช้ร่วมกับ Usage Sequence โดยเฉพาะกรณี Parallel Machine และแต่ละช่องมี Comment ได้ เช่น “เดินไป Machine B” หรือ “หยิบชิ้นงานจาก Buffer”</p><div class="formula">ช่อง Walking ที่เว้นว่าง = <b>0 sec</b> และยังถือว่าเป็นเส้นทางที่ใช้งานได้</div>`:`<h2>Walking 1–5</h2><p>Walking 1–5 works with Usage Sequence, especially for parallel machines. Each walking field has its own comment.</p><div class="formula">Blank Walking value = <b>0 sec</b> and the route is still valid.</div>`,
ol:th?`<h2>OL / Overlap</h2><p>OL ปิด = ใช้เงื่อนไข Auto ปกติ</p><p>OL เปิด + Overlap ว่าง/0 = ระบบอนุญาต overlap ตามเงื่อนไขอัตโนมัติ</p><p>OL เปิด + Overlap = X = Manual เริ่มก่อน Auto จบได้สูงสุด X</p><p>Auto Handling สามารถเลือก <b>Wait</b> หรือ <b>Skip / Continue</b> ราย Process ได้</p>`:`<h2>OL / Overlap</h2><p>OL Off uses normal automatic-time constraints.</p><p>OL On with zero/blank overlap uses automatic overlap logic.</p><p>OL On with X allows manual work to start up to X before automatic completion.</p><p>Auto Handling can be <b>Wait</b> or <b>Skip / Continue</b> per process.</p>`,
scenario:th?`<h2>Scenario และ Compare</h2><p>สร้าง Scenario ได้ทั้งแบบ Blank และ Duplicate Current. การ Duplicate จะคัดลอก Process, Operator, Machine, Takt, สี, Setting และข้อมูลกราฟทั้งหมด แล้วจึงแก้เฉพาะจุดที่ต้องการศึกษา</p><p>หน้า Compare แสดง Line C/T, Takt, Bottleneck, Waiting, Walking และ Workload ของหลาย Scenario พร้อมกัน</p>`:`<h2>Scenario & Compare</h2><p>Create scenarios from blank or duplicate the current scenario. Duplication copies processes, operators, machines, takt, settings and chart data.</p><p>Compare view shows Line C/T, Takt, bottleneck, waiting, walking and workload across multiple scenarios.</p>`,
save:th?`<h2>Save / Load Project</h2><p><b>Save Project</b> จะบันทึก Project และทุก Scenario ลงไฟล์ <code>.yamproj</code> บนคอมพิวเตอร์</p><p><b>Load Project</b> ใช้เปิดไฟล์เดิมกลับมาทำงานต่อได้</p>`:`<h2>Save / Load Project</h2><p><b>Save Project</b> stores the project and all scenarios in a local <code>.yamproj</code> file.</p><p><b>Load Project</b> restores the project for continued work.</p>`};el.innerHTML=(map[key]||map.start)+`<div class="copyright-note">Copyright 2026 Boonyarit Chotisatkul. All rights reserved.</div>`}
function openSettings(){const s=activeScenario();document.getElementById('setName').value=s.name;document.getElementById('setUnit').value=s.timeUnit;document.getElementById('setTaktMode').value=s.taktMode;document.getElementById('setManualTakt').value=s.manualTakt;document.getElementById('setAvailable').value=s.availableTime;document.getElementById('setDemand').value=s.requiredQty;document.getElementById('setCommonQtyMode').value=s.commonQtyMode||'auto';document.getElementById('setCommonQty').value=s.commonQtyOverride||commonProductionQty(s);showModal(true)}
function applySettings(){const s=activeScenario();const unit=document.getElementById('setUnit').value;if(unit!==s.timeUnit)convertScenarioUnit(s,unit);s.name=document.getElementById('setName').value||s.name;s.taktMode=document.getElementById('setTaktMode').value;s.manualTakt=Number(document.getElementById('setManualTakt').value)||0;s.availableTime=Number(document.getElementById('setAvailable').value)||0;s.requiredQty=Number(document.getElementById('setDemand').value)||0;s.commonQtyMode=document.getElementById('setCommonQtyMode').value;s.commonQtyOverride=Math.max(1,Math.round(Number(document.getElementById('setCommonQty').value)||1));showModal(false);renderAll()}
function convertScenarioUnit(s,newUnit){if(s.timeUnit===newUnit)return;const factor=s.timeUnit==='sec'&&newUnit==='min'?1/60:60;const fields=['manual','auto','auto2','overlap'];s.processes.forEach(p=>{fields.forEach(f=>p[f]=(Number(p[f])||0)*factor);p.walk=(p.walk||[0,0,0,0,0]).map(v=>(Number(v)||0)*factor)});s.manualTakt=(Number(s.manualTakt)||0)*factor;s.availableTime=(Number(s.availableTime)||0)*factor;s.timeUnit=newUnit}
function showModal(on){document.getElementById('settingsModal').classList.toggle('show',on)}
function saveProject(){const blob=new Blob([JSON.stringify(state.project,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(activeScenario().name||'project').replace(/[^\w\-]+/g,'_')+'.yamproj';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast(t('saved'))}
async function importExcelWorkData(e){
 const file=e.target.files?.[0];if(!file)return;
 try{
   let rowsBySheet=[];
   if(typeof XLSX!=='undefined'){
     const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});
     rowsBySheet=wb.SheetNames.map(name=>({name,rows:XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null})}));
   }else if(/\.xlsx$/i.test(file.name)){
     rowsBySheet=await readXlsxBasic(file);
   }else{
     throw new Error('Old .xls requires SheetJS');
   }
   let chosen=rowsBySheet.find(sh=>sh.rows.some(r=>String(r?.[0]??'').replace(/\s+/g,'').includes('作業者')))||rowsBySheet.find(sh=>sh.rows.some(r=>r.some(v=>/operator|ผู้ปฏิบัติงาน/i.test(String(v??'')))))||rowsBySheet[0];
   if(!chosen)throw new Error('No worksheet');
   const rows=chosen.rows,wsName=chosen.name||'Sheet1';let data=[];
   let protoRow=rows.findIndex(r=>String(r?.[0]??'').replace(/\s+/g,'').includes('作業者'));
   if(protoRow>=0){
     for(let i=protoRow+3;i<rows.length;i++){const r=rows[i]||[];if(r.slice(0,16).every(v=>v===null||v===''))continue;const op=Number(r[0]);if(!Number.isFinite(op)||op<=0)continue;const p=defaultProcess(data.length+1);p.operator=op;p.workSeq=Number(r[1])||1;p.usageSeq=Number(r[2])||1;p.process=String(r[3]??'').trim()||`Process ${data.length+1}`;p.machine=String(r[4]??'').trim();p.setQty=Math.max(1,Number(r[5])||1);p.manual=Number(r[6])||0;p.auto=Number(r[7])||0;p.auto2=Number(r[8])||0;p.frequency=Number(r[9])||0;p.walk=[10,11,12,13,14].map(c=>Number(r[c])||0);p.ol=String(r[15]??'').trim()!==''&&String(r[15]).trim()!=='0';p.basis='perSet';p.category='manual';p.auto2Mode='replace';p.handling='wait';p.walkComment=['','','','','',''];p.comment=`Imported from ${wsName}`;data.push(p)}
   }else{
     const headerIndex=rows.findIndex(r=>r.some(v=>/operator|ผู้ปฏิบัติงาน/i.test(String(v??''))));if(headerIndex<0)throw new Error('Header not found');
     const hdr=(rows[headerIndex]||[]).map(v=>String(v??'').trim().toLowerCase());const col=(...names)=>hdr.findIndex(h=>names.some(n=>h.includes(n)));
     const ix={op:col('operator','ผู้ปฏิบัติงาน'),seq:col('work seq','sequence','ลำดับงาน'),usage:col('usage','ลำดับใช้งาน'),proc:col('process','กระบวนการ'),mach:col('machine','เครื่องจักร'),set:col('set qty','set','จำนวนต่อ set'),manual:col('manual'),auto:col('auto'),auto2:col('auto 2','auto2'),freq:col('frequency','ความถี่'),ol:col('ol')};
     for(let i=headerIndex+1;i<rows.length;i++){const r=rows[i]||[];const op=Number(r[ix.op]);if(!Number.isFinite(op)||op<=0)continue;const p=defaultProcess(data.length+1);p.operator=op;p.workSeq=Number(r[ix.seq])||1;p.usageSeq=ix.usage>=0?(Number(r[ix.usage])||1):1;p.process=ix.proc>=0?String(r[ix.proc]??'').trim():`Process ${data.length+1}`;p.machine=ix.mach>=0?String(r[ix.mach]??'').trim():'';p.setQty=ix.set>=0?Math.max(1,Number(r[ix.set])||1):1;p.manual=ix.manual>=0?Number(r[ix.manual])||0:0;p.auto=ix.auto>=0?Number(r[ix.auto])||0:0;p.auto2=ix.auto2>=0?Number(r[ix.auto2])||0:0;p.frequency=ix.freq>=0?Number(r[ix.freq])||0:0;p.ol=ix.ol>=0&&String(r[ix.ol]??'').trim()!=='';p.walk=[0,0,0,0,0];for(let k=0;k<5;k++){const wi=col(`walk ${k+1}`,`walking ${k+1}`,`เดิน ${k+1}`);if(wi>=0)p.walk[k]=Number(r[wi])||0}p.basis='perSet';p.category='manual';p.comment=`Imported from ${wsName}`;data.push(p)}
   }
   if(!data.length)throw new Error('No process rows');
   const sc=activeScenario();sc.processes=data;if(protoRow>=0)sc.timeUnit='min';state.selectedProcessId=null;renderAll();toast(`${t('excelImported')}: ${data.length} rows`);
 }catch(err){console.error(err);toast(t('excelImportError')+(/\.xls$/i.test(file.name)?' (.xls → please save as .xlsx)':''))}finally{e.target.value=''}
}
function xmlDecode(s){return String(s??'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&apos;/g,"'")}
function colIndexFromRef(ref){let n=0;for(const ch of (ref.match(/[A-Z]+/i)?.[0]||'A').toUpperCase())n=n*26+(ch.charCodeAt(0)-64);return n-1}
async function unzipXlsxEntries(file){
 const buf=await file.arrayBuffer(),dv=new DataView(buf),u8=new Uint8Array(buf);let eocd=-1;for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}}if(eocd<0)throw new Error('Invalid ZIP');
 const count=dv.getUint16(eocd+10,true),cdOffset=dv.getUint32(eocd+16,true),entries={};let p=cdOffset;
 for(let i=0;i<count;i++){if(dv.getUint32(p,true)!==0x02014b50)break;const method=dv.getUint16(p+10,true),compSize=dv.getUint32(p+20,true),nameLen=dv.getUint16(p+28,true),extraLen=dv.getUint16(p+30,true),commentLen=dv.getUint16(p+32,true),localOff=dv.getUint32(p+42,true),name=new TextDecoder().decode(u8.slice(p+46,p+46+nameLen));entries[name]={method,compSize,localOff};p+=46+nameLen+extraLen+commentLen}
 async function extract(name){const ent=entries[name];if(!ent)return null;const o=ent.localOff;if(dv.getUint32(o,true)!==0x04034b50)throw new Error('Bad local header');const nl=dv.getUint16(o+26,true),el=dv.getUint16(o+28,true),start=o+30+nl+el,raw=u8.slice(start,start+ent.compSize);if(ent.method===0)return raw;if(ent.method===8){const ds=new DecompressionStream('deflate-raw');return new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer())}throw new Error('Unsupported ZIP method')}
 return {entries,extract}
}
async function readXlsxBasic(file){
 const z=await unzipXlsxEntries(file),dec=new TextDecoder('utf-8');let shared=[];const ss=await z.extract('xl/sharedStrings.xml');if(ss){const xml=dec.decode(ss);shared=[...xml.matchAll(/<si[^>]*>([\s\S]*?)<\/si>/g)].map(m=>{const body=m[1].replace(/<rPh\b[\s\S]*?<\/rPh>/g,'');return xmlDecode([...body.matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x=>x[1]).join(''))})}
 const names=Object.keys(z.entries).filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));const out=[];
 for(const name of names){const bytes=await z.extract(name);if(!bytes)continue;const xml=dec.decode(bytes),rows=[];for(const rm of xml.matchAll(/<row\b[^>]*r="(\d+)"[^>]*>([\s\S]*?)<\/row>/g)){const ri=Number(rm[1])-1,row=rows[ri]||[];for(const cm of rm[2].matchAll(/<c\b([^>]*)>([\s\S]*?)<\/c>/g)){const attrs=cm[1],body=cm[2],ref=(attrs.match(/\br="([A-Z]+\d+)"/i)||[])[1];if(!ref)continue;const ci=colIndexFromRef(ref),type=(attrs.match(/\bt="([^"]+)"/)||[])[1]||'',vm=(body.match(/<v[^>]*>([\s\S]*?)<\/v>/)||[])[1],tm=[...body.matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x=>x[1]).join('');let val=null;if(type==='s')val=shared[Number(vm)]??'';else if(type==='inlineStr')val=xmlDecode(tm);else if(type==='str')val=xmlDecode(vm??tm);else if(vm!=null&&vm!==''){const n=Number(vm);val=Number.isFinite(n)?n:xmlDecode(vm)}row[ci]=val}rows[ri]=row}out.push({name:name.split('/').pop().replace('.xml',''),rows})}
 return out
}
function loadProject(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(r.result);if(!p.scenarios||!Array.isArray(p.scenarios))throw new Error();state.project=p;if(!state.project.language)state.project.language='en';state.project.scenarios.forEach(s=>s.processes.forEach(p=>{if(!p.category)p.category='manual'}));state.project.scenarios.forEach(s=>{if(!s.commonQtyMode)s.commonQtyMode='auto';if(!s.commonQtyOverride)s.commonQtyOverride=1});if(!state.project.activeScenarioId||!state.project.scenarios.some(s=>s.id===state.project.activeScenarioId))state.project.activeScenarioId=state.project.scenarios[0].id;state.compareSelected=new Set(state.project.scenarios.slice(0,3).map(s=>s.id));renderAll();toast(t('loaded'))}catch{toast(t('invalidProject'))}};r.readAsText(f);e.target.value=''}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1700)}
function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function runSelfTests(){
 const s=defaultScenario('Test');s.processes=[{...defaultProcess(1),manual:10,auto:30,walk:[5,0,0,0,0],operator:1,machine:'A',basis:'perSet',handling:'wait'},{...defaultProcess(2),id:uid(),manual:7,auto:0,walk:[0,0,0,0,0],operator:1,machine:'B',basis:'perSet',handling:'wait'}];s.manualTakt=60;const c=calculateScenario(s);console.assert(Math.abs(c.operatorCT['1']-22)<.001,'Operator CT test');console.assert(Math.abs(c.takt-60)<.001,'Takt test');const s2=defaultScenario('Auto2');s2.processes=[{...defaultProcess(1),manual:0,auto:10,auto2:20,frequency:5,auto2Mode:'replace',walk:[0,0,0,0,0]}];s2.processes[0].setQty=1;s2.processes[0].frequency=1;console.assert(calculateScenario(s2).processResults[s2.processes[0].id].autoActual===20,'Auto2 replace');const s3=defaultScenario('Batch');s3.processes=[{...defaultProcess(1),manual:10,auto:0,walk:[0,0,0,0,0],setQty:1,basis:'perSet'},{...defaultProcess(2),id:uid(),workSeq:2,manual:5,auto:0,walk:[0,0,0,0,0],setQty:2,basis:'perSet'}];const c3=calculateScenario(s3);console.assert(c3.commonQty===2,'Common qty LCM');console.assert(Math.abs(c3.operatorBatchCT['1']-25)<.001,'Batch CT repeat');console.assert(Math.abs(c3.operatorCT['1']-12.5)<.001,'Per piece CT');console.info('Self-tests completed');
